<nav class="glass navbar">
  <div class="logo-container" (click)="changeView('landing')" style="cursor: pointer;">
    <img src="assets/brand/logo_sin_eslogan.png" alt="EDÚ-KT Logo" class="main-logo">
  </div>
  <div class="nav-links">
    <a href="javascript:void(0)" (click)="changeView('landing')">Cursos</a>
    <a href="javascript:void(0)" (click)="changeView('about')">Sobre nosotros</a>
    <a href="javascript:void(0)" (click)="changeView('contact')">Contáctanos</a>

    <ng-container *ngIf="currentUser?.role === 'ADMIN'">
      <a href="javascript:void(0)" class="admin-link" (click)="changeView('admin')">Panel Admin</a>
    </ng-container>

    <button class="theme-toggle" (click)="toggleTheme()" title="Cambiar Tema">
      {{ isDarkMode ? '☀️' : '🌙' }}
    </button>
    
    <ng-container *ngIf="!currentUser">
      <button class="btn-outline" (click)="changeView('register')">Registrarse</button>
      <button class="btn-primary" (click)="changeView('login')">Iniciar Sesión</button>
    </ng-container>
    
    <ng-container *ngIf="currentUser">
      <div class="user-profile" (click)="changeView('profile')" style="cursor: pointer;">
        <div class="nav-avatar" *ngIf="currentUser.avatarUrl">
          <img [src]="currentUser.avatarUrl" alt="Avatar">
        </div>
        <span class="user-name">{{ currentUser.name }}</span>
        <button class="btn-outline btn-sm" (click)="logout(); $event.stopPropagation()">Salir</button>
      </div>
    </ng-container>
  </div>
</nav>
